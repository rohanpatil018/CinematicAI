# ══════════════════════════════════════════════════════════════════
#  CineMatch AI — Full-Stack Docker Compose
#  Run:  docker compose up --build
#  URL:  http://localhost (port 80)
# ══════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────
  #  Nginx Reverse Proxy  (entry point)
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: cinematch-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    networks:
      - cinematch-network

  # ─────────────────────────────────────────────
  #  React / Vite Frontend
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./cinematch-ai
      dockerfile: Dockerfile
    container_name: cinematch-frontend
    restart: unless-stopped
    networks:
      - cinematch-network

  # ─────────────────────────────────────────────
  #  FastAPI Backend
  # ─────────────────────────────────────────────
  api:
    build:
      context: ./cinematch-backend
      dockerfile: Dockerfile
    container_name: cinematch-api
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=postgresql+asyncpg://cinematch:cinematch_secret@postgres:5432/cinematch_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: [ "CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped
    networks:
      - cinematch-network

  # ─────────────────────────────────────────────
  #  Background Worker
  # ─────────────────────────────────────────────
  worker:
    build:
      context: ./cinematch-backend
      dockerfile: Dockerfile
    container_name: cinematch-worker
    command: [ "python", "-m", "app.background.streaming_alert_worker" ]
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=postgresql+asyncpg://cinematch:cinematch_secret@postgres:5432/cinematch_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
    restart: unless-stopped
    networks:
      - cinematch-network

  # ─────────────────────────────────────────────
  #  PostgreSQL Database
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cinematch-postgres
    environment:
      POSTGRES_USER: cinematch
      POSTGRES_PASSWORD: cinematch_secret
      POSTGRES_DB: cinematch_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U cinematch -d cinematch_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cinematch-network

  # ─────────────────────────────────────────────
  #  Redis Cache
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cinematch-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cinematch-network

# ─────────────────────────────────────────────
#  Named Volumes
# ─────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_data:
    driver: local

# ─────────────────────────────────────────────
#  Network
# ─────────────────────────────────────────────
networks:
  cinematch-network:
    driver: bridge
